[project]
name = "mytasks-api"
version = "0.1.0"
description = "API del Gestor Personal de Tareas (matriz de Eisenhower)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "google-cloud-firestore>=2.19",
    "firebase-admin>=6.5",
    "uvicorn[standard]>=0.30",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
    "ruff>=0.7",
    "mypy>=1.11",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mytasks_api"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ASYNC"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.Path", "fastapi.Query"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["mytasks_api"]
mypy_path = "src"
explicit_package_bases = true

[[tool.mypy.overrides]]
module = "firebase_admin.*"
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
addopts = "-m 'not perf'"
markers = [
    "unit: tests unitarios de dominio y servicios, sin I/O",
    "integration: tests de integración contra los emuladores de Firebase",
    "perf: comprobación del objetivo de rendimiento (p95 < 300 ms); `pytest -m perf`, no corre por defecto",
]
