# Throwaway workflow for T045 (specs/002-cloud-run-cicd/research.md, R3).
# It only prints non-sensitive OIDC claims; the token is masked and never sent anywhere.
# Delete this branch after reading the results. Never merge it.
name: t045-claims

on:
  push:
    branches: ["feature/t045-claims"]
  pull_request:
    branches: [develop]

permissions:
  contents: read

jobs:
  claims-environment:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: staging
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Print non-sensitive OIDC claims
        run: |
          token=$(curl -sS -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=t045-claims" | jq -r .value)
          echo "::add-mask::${token}"
          TOKEN="${token}" python3 -c 'import os, json, base64; p = os.environ["TOKEN"].split(".")[1]; p += "=" * (-len(p) % 4); c = json.loads(base64.urlsafe_b64decode(p)); keys = ["sub", "repository", "repository_id", "repository_owner_id", "environment", "event_name", "ref", "job_workflow_ref"]; print(json.dumps({k: c.get(k) for k in keys}, indent=2))'

  claims-pull-request:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Print non-sensitive OIDC claims
        run: |
          token=$(curl -sS -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=t045-claims" | jq -r .value)
          echo "::add-mask::${token}"
          TOKEN="${token}" python3 -c 'import os, json, base64; p = os.environ["TOKEN"].split(".")[1]; p += "=" * (-len(p) % 4); c = json.loads(base64.urlsafe_b64decode(p)); keys = ["sub", "repository", "repository_id", "repository_owner_id", "environment", "event_name", "ref", "job_workflow_ref"]; print(json.dumps({k: c.get(k) for k in keys}, indent=2))'
