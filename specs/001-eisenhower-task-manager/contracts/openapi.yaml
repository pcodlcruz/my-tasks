openapi: 3.1.0
info:
  title: MyTasks API
  version: 1.4.0
  description: >-
    API del Gestor Personal de Tareas (feature 001-eisenhower-task-manager; cuenta y
    administración, feature 003-user-roles-invitations; perfil y preferencias, feature
    004-user-profile-settings; progreso diario, tareas programadas y modo arcade, feature
    007-daily-progress-arcade). Ningún endpoint acepta puntuación, racha, nivel ni logros del
    cliente: los calcula el servidor. El día de progreso va de 04:00 a 03:59 en la zona horaria
    de la persona. La cabecera `X-Test-Now` solo se admite con `APP_ENV=local`.
    Todas las rutas bajo /api/v1 exigen un ID token de Firebase Auth en
    `Authorization: Bearer <token>`, y además una cuenta activa: el acceso es solo por
    invitación (403 `access_denied` si no la hay o fue retirada) y `/api/v1/admin` exige rol
    `admin`. El usuario se identifica siempre por el
    `uid` del token; una tarea de otro usuario responde 404. Cada usuario puede
    tener como máximo 500 tareas activas (FR-016). Todas las respuestas incluyen
    `X-Request-ID` (generado por el servidor, para correlacionar con los logs) y
    cabeceras de seguridad (`X-Content-Type-Options: nosniff`, `X-Frame-Options: DENY`,
    `Referrer-Policy: no-referrer`, `Cache-Control: no-store`).
    Este documento (y `/docs`, `/openapi.json`) solo se publica con `APP_ENV=local`.
servers:
  - url: http://localhost:8000
    description: Local

security:
  - firebaseIdToken: []

paths:
  /healthz:
    get:
      summary: Comprobación de vida (sin datos de tareas, sin autenticación)
      security: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, const: ok }

  /health:
    get:
      summary: Igual que `/healthz`. Existe porque Cloud Run no deja pasar `/healthz` al contenedor
      security: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, const: ok }

  # Cuenta y administración: añadidas por la feature 003-user-roles-invitations (fuente:
  # specs/003-user-roles-invitations/contracts/access.yaml).
  /api/v1/me:
    get:
      summary: Cuenta de la sesión; acepta la invitación pendiente o aplica el bootstrap
      description: >-
        Único punto que crea cuentas: si no existe `users/{uid}` y hay una invitación pendiente
        para el correo verificado del token, la acepta; si el correo es `BOOTSTRAP_ADMIN_EMAIL`,
        crea el administrador. En cualquier otro caso, 403.
      responses:
        "200":
          description: Cuenta activa.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MeOut" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/AccessDenied" }
        "503": { $ref: "#/components/responses/AuthUnavailable" }

  /api/v1/me/profile:
    get:
      operationId: getProfile
      summary: Preferencias de la persona (con los valores por defecto aplicados si no hay ninguna)
      responses:
        "200":
          description: Perfil efectivo.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProfileOut" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/AccessDenied" }
        "503": { $ref: "#/components/responses/AuthUnavailable" }
    patch:
      operationId: updateProfile
      summary: Cambia uno o varios campos; los no enviados no se tocan
      description: >-
        Atómico: si algún campo no es válido no se guarda ninguno. `display_name: null` (o una
        cadena que queda vacía tras recortar espacios) vuelve al nombre de Google. En `avatar`
        solo se admite `initials` o `preset`; `upload` solo lo fija `PUT /api/v1/me/avatar`.
        Elegir `initials` o `preset` elimina la imagen subida, si la había.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ProfileUpdateIn" }
      responses:
        "200":
          description: Perfil efectivo tras el cambio.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProfileOut" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/AccessDenied" }
        "503": { $ref: "#/components/responses/AuthUnavailable" }
        "422": { $ref: "#/components/responses/ValidationError" }
    delete:
      operationId: resetProfile
      summary: Restablece tema, densidad, ámbito por defecto, orden y periodo del historial
      description: No cambia el nombre para mostrar ni el avatar.
      responses:
        "200":
          description: Perfil efectivo tras el restablecimiento.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProfileOut" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/AccessDenied" }
        "503": { $ref: "#/components/responses/AuthUnavailable" }

  /api/v1/me/avatar:
    get:
      operationId: getAvatar
      summary: Imagen de avatar subida por la persona autenticada
      description: >-
        Solo existe mientras `avatar.kind = upload`. Se sirve con `X-Content-Type-Options: nosniff`
        y `Cache-Control: private, max-age=31536000, immutable`; el cliente la pide con
        `?v=<avatar.version>` para invalidar la caché al cambiarla.
      parameters:
        - name: v
          in: query
          required: false
          description: Versión del avatar, solo para la caché del navegador. El servidor la ignora.
          schema: { type: integer, minimum: 0 }
      responses:
        "200":
          description: Imagen reprocesada (WebP cuadrado de 256×256).
          content:
            image/webp:
              schema: { type: string, format: binary }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/AccessDenied" }
        "503": { $ref: "#/components/responses/AuthUnavailable" }
        "404":
          description: La persona no tiene imagen subida (`avatar_not_found`).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "422": { $ref: "#/components/responses/ValidationError" }
    put:
      operationId: uploadAvatar
      summary: Sube o sustituye la imagen de avatar
      description: >-
        El cuerpo es la imagen en bruto. Se identifica por su contenido (no por `Content-Type` ni
        extensión), se rechaza si supera 2 MB o un tope de píxeles, y se reprocesa (orientación
        EXIF aplicada, metadatos eliminados, recorte cuadrado centrado, 256×256, WebP). La imagen
        anterior se sustituye. Máximo 10 subidas por hora y persona.
      requestBody:
        required: true
        content:
          image/jpeg:
            schema: { type: string, format: binary, maxLength: 2097152 }
          image/png:
            schema: { type: string, format: binary, maxLength: 2097152 }
          image/webp:
            schema: { type: string, format: binary, maxLength: 2097152 }
      responses:
        "200":
          description: Perfil efectivo con `avatar.kind = upload`.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProfileOut" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/AccessDenied" }
        "503": { $ref: "#/components/responses/AuthUnavailable" }
        "413":
          description: La imagen supera 2 MB (`avatar_too_large`).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "415":
          description: >-
            No es JPEG, PNG ni WebP, o está corrupta, o excede el tope de píxeles
            (`avatar_unsupported`). El avatar anterior no cambia.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "429":
          description: >-
            Más de 10 subidas en la última hora (`avatar_rate_limited`). La cabecera
            `Retry-After` indica los segundos restantes.
          headers:
            Retry-After:
              schema: { type: integer, minimum: 1 }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
    delete:
      operationId: deleteAvatar
      summary: Quita el avatar (imagen subida o predefinido) y vuelve a las iniciales
      description: Idempotente. No cuenta para el límite de subidas.
      responses:
        "200":
          description: Perfil efectivo con `avatar.kind = initials`.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProfileOut" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/AccessDenied" }
        "503": { $ref: "#/components/responses/AuthUnavailable" }

  /api/v1/admin/access:
    get:
      summary: Lista invitaciones y cuentas (solo admin)
      responses:
        "200":
          description: Hasta 100 invitaciones y 100 cuentas, las más recientes.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AccessListOut" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/AccessDenied" }
        "503": { $ref: "#/components/responses/AuthUnavailable" }

  /api/v1/admin/invitations:
    post:
      summary: Invita un correo, o reactiva la cuenta revocada con ese correo (solo admin)
      description: >-
        Como máximo 50 invitaciones pendientes a la vez. Reinvitar a una dirección ya pendiente
        y reactivar una cuenta no consumen hueco.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/InvitationIn" }
      responses:
        "201":
          description: Invitación creada o cuenta reactivada.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/InviteResultOut" }
        "200":
          description: Ya había una invitación pendiente para ese correo; no se duplica.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/InviteResultOut" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/AccessDenied" }
        "409":
          description: >-
            El correo ya tiene una cuenta activa (código `already_active`), o ya hay 50
            invitaciones pendientes (código `invitation_limit_reached`).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "422": { $ref: "#/components/responses/ValidationError" }
        "503": { $ref: "#/components/responses/AuthUnavailable" }

  /api/v1/admin/invitations/{email}:
    delete:
      summary: Revoca una invitación pendiente (solo admin)
      parameters:
        - { name: email, in: path, required: true, schema: { type: string, minLength: 1, maxLength: 254 } }
      responses:
        "204": { description: Invitación revocada. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/AccessDenied" }
        "404":
          description: No hay invitación pendiente para ese correo (código `not_found`).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "503": { $ref: "#/components/responses/AuthUnavailable" }

  /api/v1/admin/users/{uid}:
    delete:
      summary: Retira el acceso a un usuario; sus tareas se conservan (solo admin)
      parameters:
        - { name: uid, in: path, required: true, schema: { type: string, minLength: 1, maxLength: 128 } }
      responses:
        "204": { description: Acceso retirado. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/AccessDenied" }
        "404":
          description: La cuenta no existe (código `not_found`).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "409":
          description: No se puede retirar el acceso a un administrador (código `admin_protected`).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "503": { $ref: "#/components/responses/AuthUnavailable" }

  /api/v1/tasks:
    get:
      summary: Lista tareas de una vista (tablero, historial o papelera)
      parameters:
        - name: view
          in: query
          required: true
          schema: { type: string, enum: [board, history, trash] }
        - name: scope
          in: query
          required: false
          description: Solo para `view=board`. Sin valor = "Todas".
          schema: { $ref: "#/components/schemas/Scope" }
        - name: cursor
          in: query
          required: false
          description: Solo para `history` y `trash`. Opaco; viene de `next_cursor`. Un cursor mal formado responde 422.
          schema: { type: string }
        - name: limit
          in: query
          required: false
          description: Solo para `history` y `trash`.
          schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
        - name: order
          in: query
          required: false
          description: >-
            Solo con `view=board`. Orden dentro de cada cuadrante; las fijadas van siempre
            primero. Por defecto `oldest`. Con otra `view` se ignora.
          schema: { type: string, enum: [oldest, newest], default: oldest }
        - name: within_days
          in: query
          required: false
          description: >-
            Solo con `view=history`. Limita el historial a lo completado en los últimos N días.
            Sin el parámetro, se devuelve todo. Con otra `view` se ignora.
          schema: { type: integer, enum: [30, 90] }
      responses:
        "200":
          description: >-
            `board`: todas las tareas activas fuera de la papelera, fijadas primero y luego por
            `created_at` asc; `next_cursor` siempre null. `history`: completadas por
            `completed_at` desc. `trash`: en papelera por `trashed_at` desc.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TaskPage" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/AccessDenied" }
        "422": { $ref: "#/components/responses/ValidationError" }
        "503": { $ref: "#/components/responses/AuthUnavailable" }
    post:
      summary: Crea una tarea activa
      description: Si el usuario ya tiene 500 tareas activas, 409 `task_limit_reached` (FR-016).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TaskCreate" }
      responses:
        "201":
          description: Creada
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Task" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/AccessDenied" }
        "409": { $ref: "#/components/responses/TaskLimitReached" }
        "422": { $ref: "#/components/responses/ValidationError" }
        "503": { $ref: "#/components/responses/AuthUnavailable" }

  /api/v1/tasks/{taskId}:
    parameters:
      - $ref: "#/components/parameters/TaskId"
    get:
      summary: Obtiene una tarea (en cualquier estado)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Task" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/AccessDenied" }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { $ref: "#/components/responses/AuthUnavailable" }
    patch:
      summary: Edita una tarea activa (incluye fijar/desfijar)
      description: Solo tareas activas fuera de la papelera; si no, 409.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TaskUpdate" }
      responses:
        "200":
          description: Actualizada (con el cuadrante recalculado)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Task" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/AccessDenied" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/InvalidTransition" }
        "422": { $ref: "#/components/responses/ValidationError" }
        "503": { $ref: "#/components/responses/AuthUnavailable" }
    delete:
      summary: Borra definitivamente una tarea que está en la papelera
      description: Si la tarea no está en la papelera, 409 (primero hay que moverla).
      responses:
        "204": { description: Borrada para siempre }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/AccessDenied" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/InvalidTransition" }
        "503": { $ref: "#/components/responses/AuthUnavailable" }

  /api/v1/tasks/{taskId}/complete:
    parameters:
      - $ref: "#/components/parameters/TaskId"
    post:
      summary: Marca como completada una tarea activa
      responses:
        "200": { $ref: "#/components/responses/TaskOk" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/AccessDenied" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/InvalidTransition" }
        "503": { $ref: "#/components/responses/AuthUnavailable" }

  /api/v1/tasks/{taskId}/reopen:
    parameters:
      - $ref: "#/components/parameters/TaskId"
    post:
      summary: Reabre una tarea completada (vuelve a activa)
      description: Si el usuario ya tiene 500 tareas activas, 409 `task_limit_reached` (FR-016).
      responses:
        "200": { $ref: "#/components/responses/TaskOk" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/AccessDenied" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/InvalidTransitionOrLimit" }
        "503": { $ref: "#/components/responses/AuthUnavailable" }

  /api/v1/tasks/{taskId}/trash:
    parameters:
      - $ref: "#/components/parameters/TaskId"
    post:
      summary: Mueve una tarea (activa o completada) a la papelera
      responses:
        "200": { $ref: "#/components/responses/TaskOk" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/AccessDenied" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/InvalidTransition" }
        "503": { $ref: "#/components/responses/AuthUnavailable" }

  /api/v1/tasks/{taskId}/restore:
    parameters:
      - $ref: "#/components/parameters/TaskId"
    post:
      summary: Restaura una tarea de la papelera a su estado anterior
      description: >-
        Si la tarea estaba activa y el usuario ya tiene 500 tareas activas, 409
        `task_limit_reached` (FR-016). Restaurar una completada nunca lo dispara.
      responses:
        "200": { $ref: "#/components/responses/TaskOk" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/AccessDenied" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/InvalidTransitionOrLimit" }
        "503": { $ref: "#/components/responses/AuthUnavailable" }

  # Progreso diario, misión, modo arcade y tareas programadas: añadidos por la feature
  # 007-daily-progress-arcade (fuente: specs/007-daily-progress-arcade/contracts/progress.yaml).
  /api/v1/me/progress:
    get:
      operationId: getProgress
      summary: Marcador de hoy, con puesta al día idempotente
      description: >-
        Antes de responder, cierra los días pasados pendientes y genera las tareas programadas
        vencidas (research R1, R2, R6, R7). Repetir la llamada no cambia el resultado. Responde
        con `Cache-Control: no-store`. El cliente la llama al cargar la aplicación, antes de
        pedir el tablero, y al volver a la pestaña si ha cambiado el día.
      responses:
        "200":
          description: Progreso de hoy.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProgressOut" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/AccessDenied" }
        "503": { $ref: "#/components/responses/AuthUnavailable" }

  /api/v1/me/progress/review:
    post:
      operationId: markReviewSeen
      summary: Marca como vista la pantalla de inicio de jornada de hoy
      description: Idempotente. Después, `show_review` es `false` en todos los dispositivos.
      responses:
        "200":
          description: Progreso de hoy tras el cambio.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProgressOut" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/AccessDenied" }
        "503": { $ref: "#/components/responses/AuthUnavailable" }

  /api/v1/me/progress/today/mission:
    put:
      operationId: setTodayMission
      summary: Reemplaza la misión del día
      description: >-
        Hasta 5 tareas **activas** de la persona, que no estén en la papelera y sin repetir. Una
        lista vacía quita la misión. Marcar o desmarcar no da ni quita puntos. Si con el cambio
        todas las tareas de la misión quedan completadas hoy, se concede el bonus de misión.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MissionIn" }
      responses:
        "200":
          description: Progreso de hoy tras el cambio.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProgressOut" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/AccessDenied" }
        "503": { $ref: "#/components/responses/AuthUnavailable" }
        "422":
          description: >-
            Más de 5 tareas, ids repetidos, o alguna tarea que no existe, no es de la persona, no
            está activa o está en la papelera (`mission_invalid_task`). Las tareas de otra persona
            se tratan como inexistentes.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /api/v1/me/progress/ack:
    post:
      operationId: acknowledgeProgressMessages
      summary: Confirma que se han mostrado anuncios y avisos
      description: Elimina de los pendientes los ids indicados. Los ids desconocidos se ignoran.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AckIn" }
      responses:
        "204": { description: Confirmados. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/AccessDenied" }
        "503": { $ref: "#/components/responses/AuthUnavailable" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /api/v1/me/progress/days:
    get:
      operationId: listProgressDays
      summary: Días de progreso de un rango (calendario)
      description: >-
        Como mucho 84 días. Los días sin documento (sin actividad y aún sin cerrar) no se
        devuelven: el cliente los pinta vacíos.
      parameters:
        - { name: from, in: query, required: true, schema: { $ref: "#/components/schemas/Day" } }
        - { name: to, in: query, required: true, schema: { $ref: "#/components/schemas/Day" } }
      responses:
        "200":
          description: Días ordenados por fecha ascendente.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/ProgressDayOut" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/AccessDenied" }
        "503": { $ref: "#/components/responses/AuthUnavailable" }
        "422":
          description: Fechas inválidas, `from > to` o rango de más de 84 días.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /api/v1/me/progress/days/{day}:
    get:
      operationId: getProgressDay
      summary: Detalle de un día, con sus tareas completadas
      description: Lista solo las tareas que siguen existiendo fuera de la papelera (FR-029).
      parameters:
        - { name: day, in: path, required: true, schema: { $ref: "#/components/schemas/Day" } }
      responses:
        "200":
          description: Detalle del día.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProgressDayDetailOut" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/AccessDenied" }
        "503": { $ref: "#/components/responses/AuthUnavailable" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/me/progress/stats:
    get:
      operationId: getProgressStats
      summary: Estadísticas y sala de trofeos
      responses:
        "200":
          description: Estadísticas y catálogo de logros, con los conseguidos y su fecha.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StatsOut" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/AccessDenied" }
        "503": { $ref: "#/components/responses/AuthUnavailable" }

  /api/v1/schedules:
    get:
      operationId: listSchedules
      summary: Todas las programaciones de la persona (como mucho 50)
      responses:
        "200":
          description: Ordenadas por fecha de creación.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/ScheduleOut" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/AccessDenied" }
        "503": { $ref: "#/components/responses/AuthUnavailable" }
    post:
      operationId: createSchedule
      summary: Crea una programación
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ScheduleIn" }
      responses:
        "201":
          description: Creada.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ScheduleOut" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/AccessDenied" }
        "503": { $ref: "#/components/responses/AuthUnavailable" }
        "409":
          description: Ya hay 50 programaciones (`schedule_limit`).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /api/v1/schedules/{schedule_id}:
    parameters:
      - name: schedule_id
        in: path
        required: true
        schema: { type: string, pattern: "^(?!__.*__$)[A-Za-z0-9_-]{1,128}$" }
    patch:
      operationId: updateSchedule
      summary: Cambia datos o repetición; solo afecta a las próximas apariciones
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ScheduleUpdateIn" }
      responses:
        "200":
          description: Programación tras el cambio.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ScheduleOut" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/AccessDenied" }
        "503": { $ref: "#/components/responses/AuthUnavailable" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: La programación está terminada (`schedule_finished`).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "422": { $ref: "#/components/responses/ValidationError" }
    delete:
      operationId: deleteSchedule
      summary: Elimina la programación; las tareas ya generadas se quedan
      responses:
        "204": { description: Eliminada. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/AccessDenied" }
        "503": { $ref: "#/components/responses/AuthUnavailable" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/schedules/{schedule_id}/pause:
    parameters:
      - { name: schedule_id, in: path, required: true, schema: { type: string } }
    post:
      operationId: pauseSchedule
      summary: Pausa (idempotente)
      responses:
        "200":
          description: Programación pausada.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ScheduleOut" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/AccessDenied" }
        "503": { $ref: "#/components/responses/AuthUnavailable" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: La programación está terminada (`schedule_finished`).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /api/v1/schedules/{schedule_id}/resume:
    parameters:
      - { name: schedule_id, in: path, required: true, schema: { type: string } }
    post:
      operationId: resumeSchedule
      summary: Reanuda (idempotente); la próxima aparición se calcula desde hoy
      responses:
        "200":
          description: Programación activa.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ScheduleOut" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/AccessDenied" }
        "503": { $ref: "#/components/responses/AuthUnavailable" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: >-
            Programación terminada, o de fecha única con la fecha ya pasada
            (`schedule_finished`).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

components:
  securitySchemes:
    firebaseIdToken:
      type: http
      scheme: bearer
      bearerFormat: Firebase ID token (JWT)

  parameters:
    TaskId:
      name: taskId
      in: path
      required: true
      description: >-
        Identificador generado por Firestore. Solo se admiten `A-Z`, `a-z`, `0-9`, `_` y `-`;
        cualquier otro valor, y los identificadores reservados de Firestore (con la forma
        `__algo__`), responden 404 como una tarea inexistente (nunca 500). La autenticación se
        comprueba antes: sin token, 401.
      schema: { type: string, minLength: 1, maxLength: 128 }

  schemas:
    Scope:
      type: string
      enum: [work, personal]
    Quadrant:
      type: string
      enum: [do_now, schedule, delegate, eliminate]
    Status:
      type: string
      enum: [active, completed]

    TaskCreate:
      type: object
      additionalProperties: false
      required: [title, description, urgent, important, scope]
      properties:
        title: { type: string, minLength: 1, maxLength: 200, description: "Se recorta; vacío tras recortar = 422" }
        description: { type: string, minLength: 1, maxLength: 2000, description: "Se recorta; vacío tras recortar = 422" }
        urgent: { type: boolean }
        important: { type: boolean }
        scope: { $ref: "#/components/schemas/Scope" }

    TaskUpdate:
      type: object
      additionalProperties: false
      minProperties: 1
      description: Actualización parcial; los campos ausentes no cambian.
      properties:
        title: { type: string, minLength: 1, maxLength: 200 }
        description: { type: string, minLength: 1, maxLength: 2000 }
        urgent: { type: boolean }
        important: { type: boolean }
        scope: { $ref: "#/components/schemas/Scope" }
        pinned: { type: boolean }

    Task:
      type: object
      required: [id, title, description, urgent, important, quadrant, scope, pinned, status, in_trash, created_at, updated_at, completed_at, trashed_at, purge_at, schedule_id, scheduled_for]
      properties:
        schedule_id: { type: [string, "null"], description: "Programación que generó la tarea (feature 007); `null` si se creó a mano." }
        scheduled_for: { type: [string, "null"], format: date, description: "Día para el que se programó («pendiente desde», feature 007); `null` si se creó a mano." }
        id: { type: string }
        title: { type: string }
        description: { type: string }
        urgent: { type: boolean }
        important: { type: boolean }
        quadrant: { $ref: "#/components/schemas/Quadrant" }
        scope: { $ref: "#/components/schemas/Scope" }
        pinned: { type: boolean }
        status: { $ref: "#/components/schemas/Status" }
        in_trash: { type: boolean }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        completed_at: { type: [string, "null"], format: date-time }
        trashed_at: { type: [string, "null"], format: date-time }
        purge_at: { type: [string, "null"], format: date-time, description: "Momento en que la tarea desaparecerá de la papelera" }

    TaskPage:
      type: object
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/Task" }
        next_cursor: { type: [string, "null"] }

    Role: { type: string, enum: [user, admin] }
    AccountStatus: { type: string, enum: [active, revoked] }
    InvitationStatus: { type: string, enum: [pending, accepted, revoked] }

    MeOut:
      type: object
      required: [uid, email, role]
      properties:
        uid: { type: string }
        email: { type: string }
        role: { $ref: "#/components/schemas/Role" }

    InvitationIn:
      type: object
      required: [email]
      additionalProperties: false
      properties:
        email: { type: string, maxLength: 254 }

    InvitationOut:
      type: object
      required: [email, status, created_at, accepted_at]
      properties:
        email: { type: string }
        status: { $ref: "#/components/schemas/InvitationStatus" }
        created_at: { type: string, format: date-time }
        accepted_at: { type: [string, "null"], format: date-time }

    AccountOut:
      type: object
      required: [uid, email, role, status, created_at]
      properties:
        uid: { type: string }
        email: { type: string }
        role: { $ref: "#/components/schemas/Role" }
        status: { $ref: "#/components/schemas/AccountStatus" }
        created_at: { type: string, format: date-time }

    InviteResultOut:
      type: object
      required: [outcome, email]
      properties:
        outcome: { type: string, enum: [invited, already_pending, reactivated] }
        email: { type: string }

    AccessListOut:
      type: object
      required: [invitations, accounts]
      properties:
        invitations:
          type: array
          items: { $ref: "#/components/schemas/InvitationOut" }
        accounts:
          type: array
          items: { $ref: "#/components/schemas/AccountOut" }

    ProfileOut:
      type: object
      required: [theme, density, default_scope, board_order, history_days, display_name, avatar, daily_goal, active_weekdays, timezone, morning_review, arcade_mode]
      properties:
        daily_goal: { type: integer, minimum: 1, maximum: 20, description: "Meta de tareas por día (feature 007)." }
        active_weekdays:
          type: array
          maxItems: 7
          uniqueItems: true
          items: { type: integer, minimum: 1, maximum: 7, description: "ISO: 1 = lunes … 7 = domingo" }
          description: Días en los que cuenta la racha (feature 007).
        timezone: { type: [string, "null"], description: "Zona horaria IANA; la fija el cliente. Una vez fijada no se puede vaciar." }
        morning_review: { type: boolean, description: "Muestra la pantalla de inicio de jornada (feature 007)." }
        arcade_mode: { type: boolean, description: "Activa puntos, niveles y logros (feature 007)." }
        theme: { type: string, enum: [light, dark, system] }
        density: { type: string, enum: [comfortable, compact] }
        default_scope: { type: string, enum: [all, work, personal] }
        board_order: { type: string, enum: [oldest, newest] }
        history_days:
          type: [integer, "null"]
          enum: [30, 90, null]
          description: "`null` significa todo el historial."
        display_name:
          type: [string, "null"]
          minLength: 1
          maxLength: 50
          description: "`null` significa usar el nombre de Google o, en su defecto, el correo."
        avatar: { $ref: "#/components/schemas/AvatarOut" }

    AvatarOut:
      type: object
      required: [kind, preset, version]
      properties:
        kind: { type: string, enum: [initials, preset, upload] }
        preset:
          type: [string, "null"]
          pattern: "^avatar-(0[1-9]|1[0-2])$"
          description: Solo con `kind = preset`.
        version:
          type: integer
          minimum: 0
          description: Sube con cada cambio de avatar; sirve para invalidar la caché.

    ProfileUpdateIn:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        theme: { type: string, enum: [light, dark, system] }
        density: { type: string, enum: [comfortable, compact] }
        default_scope: { type: string, enum: [all, work, personal] }
        board_order: { type: string, enum: [oldest, newest] }
        history_days:
          type: [integer, "null"]
          enum: [30, 90, null]
        display_name:
          type: [string, "null"]
          maxLength: 200
          description: >-
            Se recorta con `strip` y debe quedar en 1–50 caracteres sin caracteres de control. Si
            queda vacío o es `null`, vuelve al nombre de Google. (El tope de 200 solo evita
            cuerpos enormes; el límite efectivo es 50.)
        daily_goal: { type: integer, minimum: 1, maximum: 20 }
        active_weekdays:
          type: array
          maxItems: 7
          uniqueItems: true
          items: { type: integer, minimum: 1, maximum: 7 }
        timezone:
          type: string
          maxLength: 64
          description: >-
            Zona horaria IANA válida. Una vez fijada no se puede vaciar. Es el único campo del
            perfil nuevo que admite `null` en la petición.
        morning_review: { type: boolean }
        arcade_mode: { type: boolean }
        avatar:
          type: object
          additionalProperties: false
          required: [kind]
          properties:
            kind: { type: string, enum: [initials, preset] }
            preset:
              type: string
              pattern: "^avatar-(0[1-9]|1[0-2])$"
              description: Obligatorio con `kind = preset`; prohibido con `kind = initials`.

    # Feature 007-daily-progress-arcade: progreso, arcade y tareas programadas.
    Day:
      type: string
      format: date
      description: Día de progreso (`YYYY-MM-DD`); va de 04:00 a 03:59 en la zona horaria de la persona.

    ProgressOut:
      type: object
      required:
        - today
        - goal
        - completed_count
        - goal_met
        - is_active_day
        - mission
        - show_review
        - streak
        - streak_at_stake
        - arcade
        - last_day
        - announcements
        - notices
      properties:
        today: { $ref: "#/components/schemas/Day" }
        goal: { type: integer, minimum: 1, maximum: 20 }
        completed_count: { type: integer, minimum: 0 }
        goal_met: { type: boolean }
        is_active_day: { type: boolean }
        mission:
          type: object
          required: [task_ids, completed_ids, cleared]
          properties:
            task_ids: { type: array, maxItems: 5, items: { type: string } }
            completed_ids: { type: array, maxItems: 5, items: { type: string } }
            cleared: { type: boolean }
        show_review:
          type: boolean
          description: "`morning_review` activado, hoy es día activo y aún no se ha visto hoy."
        streak:
          type: integer
          description: Racha cerrada hasta ayer más 1 si hoy es activo y ya se cumplió la meta.
        streak_at_stake:
          type: boolean
          description: Hoy es activo, aún no se ha cumplido la meta y la racha cerrada es > 0.
        arcade:
          description: "`null` si `arcade_mode` está desactivado (se sigue calculando)."
          oneOf:
            - type: "null"
            - type: object
              required: [score, level, level_name, next_level_at, points_today]
              properties:
                score: { type: integer, minimum: 0 }
                level: { type: integer, minimum: 1, maximum: 10 }
                level_name: { type: string }
                next_level_at: { type: [integer, "null"], description: "null en el nivel 10" }
                points_today: { type: integer }
        last_day:
          description: Resultado del último día activo cerrado, para la pantalla de inicio de jornada.
          oneOf:
            - type: "null"
            - { $ref: "#/components/schemas/ProgressDayOut" }
        announcements:
          type: array
          maxItems: 20
          description: Vacío si `arcade_mode` está desactivado (se conservan para cuando se active).
          items: { $ref: "#/components/schemas/AnnouncementOut" }
        notices:
          type: array
          maxItems: 20
          items: { $ref: "#/components/schemas/NoticeOut" }

    AnnouncementOut:
      type: object
      required: [id, kind]
      properties:
        id: { type: string }
        kind: { type: string, enum: [phase_clear, mission_clear, level_up, achievement, new_record] }
        value:
          type: [string, integer, "null"]
          description: Nivel alcanzado, id del logro o récord, según `kind`.

    NoticeOut:
      type: object
      required: [id, kind, schedule_id, day]
      properties:
        id: { type: string }
        kind: { type: string, enum: [schedule_skipped_limit] }
        schedule_id: { type: string }
        schedule_title: { type: [string, "null"], description: "null si la programación ya no existe" }
        day: { $ref: "#/components/schemas/Day" }

    MissionIn:
      type: object
      additionalProperties: false
      required: [task_ids]
      properties:
        task_ids:
          type: array
          maxItems: 5
          uniqueItems: true
          items: { type: string, pattern: "^(?!__.*__$)[A-Za-z0-9_-]{1,128}$" }

    AckIn:
      type: object
      additionalProperties: false
      properties:
        announcement_ids: { type: array, maxItems: 20, items: { type: string, maxLength: 64 } }
        notice_ids: { type: array, maxItems: 20, items: { type: string, maxLength: 64 } }
      minProperties: 1

    ProgressDayOut:
      type: object
      required: [date, active, goal, completed_count, goal_met, closed]
      properties:
        date: { $ref: "#/components/schemas/Day" }
        active: { type: boolean }
        goal: { type: integer }
        completed_count: { type: integer }
        goal_met: { type: boolean }
        mission_cleared: { type: boolean }
        points: { type: [integer, "null"], description: "null si `arcade_mode` está desactivado" }
        closed: { type: boolean }

    ProgressDayDetailOut:
      allOf:
        - { $ref: "#/components/schemas/ProgressDayOut" }
        - type: object
          required: [tasks]
          properties:
            tasks:
              type: array
              description: "`Task` de la feature 001, solo de las tareas que siguen fuera de la papelera."
              items: { $ref: "#/components/schemas/Task" }

    StatsOut:
      type: object
      required: [best_day_count, best_day_date, current_streak, best_streak, tasks_scored, started_at]
      properties:
        best_day_count: { type: integer }
        best_day_date: { type: [string, "null"], format: date }
        current_streak: { type: integer }
        best_streak: { type: integer }
        tasks_scored:
          type: integer
          description: Total de tareas distintas completadas desde el despliegue (una reabierta y vuelta a completar cuenta una vez).
        started_at: { type: [string, "null"], format: date-time }
        arcade:
          description: "`null` si `arcade_mode` está desactivado."
          oneOf:
            - type: "null"
            - type: object
              required: [score, level, level_name, achievements]
              properties:
                score: { type: integer }
                level: { type: integer }
                level_name: { type: string }
                achievements:
                  type: array
                  description: El catálogo completo (12), con los conseguidos marcados.
                  items:
                    type: object
                    required: [id, name, condition, unlocked_at]
                    properties:
                      id: { type: string }
                      name: { type: string }
                      condition: { type: string }
                      unlocked_at: { type: [string, "null"], format: date-time }

    Recurrence:
      oneOf:
        - type: object
          additionalProperties: false
          required: [kind, date]
          properties:
            kind: { const: once }
            date: { $ref: "#/components/schemas/Day" }
        - type: object
          additionalProperties: false
          required: [kind]
          properties:
            kind: { const: daily }
        - type: object
          additionalProperties: false
          required: [kind, weekdays]
          properties:
            kind: { const: weekly }
            weekdays:
              type: array
              minItems: 1
              maxItems: 7
              uniqueItems: true
              items: { type: integer, minimum: 1, maximum: 7, description: "ISO: 1 = lunes … 7 = domingo" }
        - type: object
          additionalProperties: false
          required: [kind, month_day]
          properties:
            kind: { const: monthly }
            month_day: { type: integer, minimum: 1, maximum: 31 }
      discriminator: { propertyName: kind }

    ScheduleIn:
      type: object
      additionalProperties: false
      required: [title, description, urgent, important, scope, recurrence]
      properties:
        title: { type: string, minLength: 1, maxLength: 200 }
        description: { type: string, minLength: 1, maxLength: 2000 }
        urgent: { type: boolean }
        important: { type: boolean }
        scope: { type: string, enum: [work, personal] }
        recurrence: { $ref: "#/components/schemas/Recurrence" }
      description: >-
        Mismas reglas que `TaskCreate` (texto solo de espacios = vacío). Con `once`, `date` DEBE
        ser hoy o futura en la zona horaria de la persona.

    ScheduleUpdateIn:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        title: { type: string, minLength: 1, maxLength: 200 }
        description: { type: string, minLength: 1, maxLength: 2000 }
        urgent: { type: boolean }
        important: { type: boolean }
        scope: { type: string, enum: [work, personal] }
        recurrence: { $ref: "#/components/schemas/Recurrence" }

    ScheduleOut:
      type: object
      required: [id, title, description, urgent, important, scope, quadrant, recurrence, status, next_occurrence, created_at]
      properties:
        id: { type: string }
        title: { type: string }
        description: { type: string }
        urgent: { type: boolean }
        important: { type: boolean }
        scope: { type: string, enum: [work, personal] }
        quadrant: { type: string, enum: [do_now, schedule, delegate, eliminate] }
        recurrence: { $ref: "#/components/schemas/Recurrence" }
        status: { type: string, enum: [active, paused, finished] }
        next_occurrence: { type: [string, "null"], format: date }
        last_generated_for: { type: [string, "null"], format: date }
        created_at: { type: string, format: date-time }

    Error:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          examples: [unauthenticated, access_denied, auth_unavailable, not_found, invalid_transition, task_limit_reached, validation_error, already_active, invitation_limit_reached, admin_protected, avatar_not_found, avatar_too_large, avatar_unsupported, avatar_rate_limited, mission_invalid_task, schedule_limit, schedule_finished]
        message: { type: string, description: "Mensaje legible en español" }
        details: { type: array, items: { type: object } }

  responses:
    TaskOk:
      description: Transición aplicada; devuelve la tarea actualizada
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Task" }
    Unauthorized:
      description: Falta el token o no es válido (código `unauthenticated`)
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    AccessDenied:
      description: >-
        Autenticado pero sin acceso: sin invitación, acceso retirado o, en `/api/v1/admin`, rol
        insuficiente (código `access_denied`). El mensaje no distingue entre esos casos. Se
        evalúa después del 401.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          example: { code: access_denied, message: No tienes acceso a esta aplicación. }
    AuthUnavailable:
      description: >-
        No se pudo verificar la sesión por un fallo del verificador de tokens (red,
        certificados de Google), no por culpa del cliente (código `auth_unavailable`).
        Se puede reintentar.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    NotFound:
      description: >-
        No existe bajo el usuario autenticado (incluye tareas de otros usuarios, tareas ya
        purgadas e identificadores con forma no válida)
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    InvalidTransition:
      description: La tarea no está en un estado que permita la operación (código `invalid_transition`)
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    TaskLimitReached:
      description: >-
        El usuario ya tiene 500 tareas activas (código `task_limit_reached`, FR-016). El mensaje,
        en español, indica el límite; completar o eliminar una tarea activa libera espacio.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    InvalidTransitionOrLimit:
      description: >-
        La tarea no está en un estado que permita la operación (`invalid_transition`) o el
        usuario ya tiene 500 tareas activas (`task_limit_reached`, FR-016).
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    ValidationError:
      description: Entrada no válida (campos obligatorios, longitudes, enums, cursor)
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
