# Nginx config of the mytasks-web image (unprivileged, port 8080).
#
# security-headers.conf is generated on startup by docker-entrypoint.d/40-runtime-config.sh
# because the Content-Security-Policy depends on the environment (API and Firebase auth
# domain). nginx does not inherit `add_header` into a location that defines its own, so the
# snippet is included in every location.

server {
    listen 8080;
    server_name _;
    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;

    include /etc/nginx/snippets/security-headers.conf;

    # Runtime config and the HTML shell must never be cached: they carry the environment
    # and the hashed asset names of the current release.
    location = /config.js {
        add_header Cache-Control "no-store" always;
        include /etc/nginx/snippets/security-headers.conf;
        try_files $uri =404;
    }

    location = /index.html {
        add_header Cache-Control "no-store" always;
        include /etc/nginx/snippets/security-headers.conf;
    }

    # Vite names these files after their content hash: safe to cache for a year.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        include /etc/nginx/snippets/security-headers.conf;
        try_files $uri =404;
    }

    location = /favicon.svg {
        add_header Cache-Control "public, max-age=86400" always;
        include /etc/nginx/snippets/security-headers.conf;
        try_files $uri =404;
    }

    # Client-side routes (React Router, e.g. /history) fall back to the SPA shell.
    location / {
        add_header Cache-Control "no-store" always;
        include /etc/nginx/snippets/security-headers.conf;
        try_files $uri /index.html;
    }
}
